<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        #progressbar{
            height: 10px;
            width: 5px;
            background-color: white;
            border: inherit;
        }
       
    </style>
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Password Generator</h1>
    <div style="height: 600px;width: 600px; background-color: aquamarine; margin: auto;">

    <div style="padding: 20px;font-size: 25px;">
       <label>Enter Password Length (0 - 15) </label>
       <input type="number" id="passlength" style="height: 18px;margin-left: 30px;">
    </div>
    <div>
    <p><input type="checkbox" style="scale: 2; margin-left: 30px;" id="incNumb">
        <span style="font-size: 20px;">Include Numbers </p>
    <p><input type="checkbox" style="scale: 2; margin-left: 30px;" id="incUpper">  
        <span style="font-size: 20px;">Include UPPER CASE </span> </p>
    <p><input type="checkbox" style="scale: 2; margin-left: 30px;" id="incSpecial"> 
        <span style="font-size: 20px;"> Include Special Chara </span></p>
    <p><input type="checkbox" style="scale: 2; margin-left: 30px;" id="excldAmbigi">  
        <span style="font-size: 20px;">Exclude Ambigious Chara(e.g. O,0,I,l,1) </span></p>
    </div>

        <button type="button" style="text-align: center; margin-left: 25px; padding: 10px; font-size: 17px; 
                                background-color: rgb(73, 73, 180); color: beige;" id="btnGeneratePass">
            Generate Password</button>

    <div style="padding: 20px;font-size: 20px;">
       <label>Generated Password </label>
       <br>
       <input type="text" style="height: 18px;" id="GeneratedPassword">
       <br>
       <p><input type="checkbox" style="scale: 2; font-size: 20px;" id="showHide" checked>  
        Show Password</p>

        <div>
            <div id="progressbar"></div>
            <label id="showstrength"> </label>
        </div>

    </div>
    </div>

    <script src="./script.js"> </script>
</body>


</html>
